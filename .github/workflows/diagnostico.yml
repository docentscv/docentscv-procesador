name: Diagnóstico puntual
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Nombre del script .py a ejecutar (debe existir en el repo)"
        required: true
        default: diagnosticar_dificil.py
      argumento:
        description: "Argumento opcional para el script"
        required: false
concurrency:
  group: diagnostico
  cancel-in-progress: true
jobs:
  diagnosticar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: |
          if command -v pdftotext >/dev/null; then echo "Ya estaba instalado"; exit 0; fi
          sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15
          sudo apt-get install -y -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15 poppler-utils
      - name: Ejecutar
        run: python3 "${{ inputs.script }}" ${{ inputs.argumento }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
