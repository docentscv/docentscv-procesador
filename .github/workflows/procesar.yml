name: Procesar PDF pendientes
on:
  schedule:
    - cron: '*/15 * * * *'      # cada 15 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:            # también se puede lanzar a mano desde la pestaña Actions
    inputs:
      cargar:
        description: 'Descargar y registrar de verdad los PDF nuevos de la Conselleria (si no, solo simula)'
        type: boolean
        default: false
      probar_avisos:
        description: 'Enviar una notificación y un email de PRUEBA solo a los administradores'
        type: boolean
        default: false
concurrency:
  group: procesar
  cancel-in-progress: false
jobs:
  procesar:
    runs-on: ubuntu-24.04      # fijado: «ubuntu-latest» pasó a Ubuntu 26.04 y falla al instalar herramientas
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        timeout-minutes: 12
        run: |
          # pdftotext (poppler) y psql. Si los servidores de Ubuntu no responden (fallo de GitHub), plan B: conda-forge.
          if command -v pdftotext >/dev/null && command -v psql >/dev/null; then echo "Ya estaban instaladas"; exit 0; fi
          if timeout 150 sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15 \
             && timeout 150 sudo apt-get install -y -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15 poppler-utils postgresql-client; then
            echo "Instaladas desde Ubuntu"; exit 0
          fi
          echo "::warning::Los servidores de Ubuntu no responden; instalo las herramientas desde conda-forge"
          cd "$HOME"
          curl -fsSL --retry 5 --retry-delay 5 https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj bin/micromamba
          PKGS="poppler"; command -v psql >/dev/null || PKGS="$PKGS postgresql"
          ./bin/micromamba create -y -q -r "$HOME/mamba" -p "$HOME/herr" -c conda-forge $PKGS
          echo "$HOME/herr/bin" >> "$GITHUB_PATH"
          "$HOME/herr/bin/pdftotext" -v 2>&1 | head -1
      - name: Instalar librería de notificaciones
        run: pip install --quiet --break-system-packages pywebpush || pip install --quiet pywebpush
      - name: Buscar PDF nuevos en la web de la Conselleria
        continue-on-error: true
        run: python3 descargar_conselleria.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AUTO_DESCARGA: ${{ (github.event_name == 'workflow_dispatch' && inputs.cargar && '1') || vars.AUTO_DESCARGA || '' }}
      - name: Procesar PDF pendientes
        run: python3 procesar_pdfs.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      - name: Probar avisos (solo si se pide a mano; avisa solo a administradores)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probar_avisos }}
        run: python3 probar_avisos.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
