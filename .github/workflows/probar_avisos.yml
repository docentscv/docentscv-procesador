name: Probar avisos (notificación y email de prueba, solo a administradores)
on:
  workflow_dispatch:
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: |
          command -v pdftotext >/dev/null && command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils postgresql-client; }
      - name: Instalar librería de notificaciones
        run: pip install --quiet --break-system-packages pywebpush || pip install --quiet pywebpush
      - name: Enviar prueba
        run: python3 probar_avisos.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
