name: Acreditación de idiomas (inglés)
on:
  schedule:
    - cron: '0 6 * * 1'        # todos los lunes a las 06:00 UTC (los PDF nuevos son poco frecuentes)
  workflow_dispatch:           # también se puede lanzar a mano desde la pestaña Actions
    inputs:
      cargar:
        description: 'Descargar y registrar de verdad los PDF nuevos (si no, solo simula: busca y analiza, pero no guarda nada)'
        type: boolean
        default: false
      estado:
        description: 'Solo consultar lo que ya hay en la base de datos (cifras, sin nombres); no busca PDF nuevos. Ignora «cargar» si se marca esto.'
        type: boolean
        default: false
      detalle:
        description: 'Con «estado» marcado: además lista fila a fila lo pendiente en idiomas_revisar (sí lleva nombres)'
        type: boolean
        default: false
      limpiar_duplicados:
        description: 'Resuelve los homónimos de idiomas_revisar que eran duplicados puros (mismo nombre, mismo nivel repetido en el PDF) y los carga. Ignora el resto de opciones si se marca esto.'
        type: boolean
        default: false
      sospechosos_candidatos:
        description: 'SOLO LECTURA: para los «nombre sospechoso», prueba a separar el apellido pegado y muestra con qué persona ya existente coincidiría. No toca la base de datos. Ignora el resto de opciones si se marca esto.'
        type: boolean
        default: false
concurrency:
  group: idiomas
  cancel-in-progress: false
jobs:
  idiomas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalar psql
        run: |
          if command -v psql >/dev/null; then echo "Ya estaba instalado"; exit 0; fi
          timeout 150 sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15
          timeout 150 sudo apt-get install -y -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15 postgresql-client
      - name: Consultar estado (sin buscar PDF nuevos)
        if: github.event_name == 'workflow_dispatch' && inputs.estado && !inputs.limpiar_duplicados
        run: python3 cargar_idiomas.py ${{ (inputs.detalle && '--detalle') || '--estado' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Limpiar homónimos que eran duplicados puros
        if: github.event_name == 'workflow_dispatch' && inputs.limpiar_duplicados
        run: python3 cargar_idiomas.py --limpiar-duplicados
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Candidatos de resolución para nombres sospechosos (solo lectura)
        if: github.event_name == 'workflow_dispatch' && inputs.sospechosos_candidatos
        run: python3 cargar_idiomas.py --sospechosos-candidatos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Instalar pdfplumber
        if: "!(github.event_name == 'workflow_dispatch' && (inputs.estado || inputs.limpiar_duplicados || inputs.sospechosos_candidatos))"
        run: pip install --quiet --break-system-packages pdfplumber || pip install --quiet pdfplumber
      - name: Instalar Tesseract (OCR, para los PDF sin texto real)
        if: "!(github.event_name == 'workflow_dispatch' && (inputs.estado || inputs.limpiar_duplicados || inputs.sospechosos_candidatos))"
        run: |
          timeout 150 sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15
          timeout 150 sudo apt-get install -y -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15 tesseract-ocr tesseract-ocr-spa
          pip install --quiet --break-system-packages pytesseract || pip install --quiet pytesseract
      - name: Buscar y cargar acreditaciones de inglés
        if: "!(github.event_name == 'workflow_dispatch' && (inputs.estado || inputs.limpiar_duplicados || inputs.sospechosos_candidatos))"
        run: python3 cargar_idiomas.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTO_CARGA: ${{ (github.event_name == 'workflow_dispatch' && inputs.cargar && '1') || '' }}
